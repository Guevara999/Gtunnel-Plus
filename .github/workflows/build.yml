name: Build Gtunnel APK

on:
  push:
  # remove branches: [] to run on all branches
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout app code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK & NDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0 ndk;27.3.13750724'

    # Remove Xposed hooks (causes "Unresolved reference" errors)
    - name: Remove Xposed source
      run: rm -rf app/src/main/java/io/nekohasekai/sfa/xposed

    # Verify the AAR exists (no rebuild needed)
    - name: Verify libbox.aar
      run: ls -la app/libs/libbox.aar

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug --stacktrace

    - name: Upload Gtunnel Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Gtunnel-Debug-APK
        path: app/build/outputs/apk/debug/*.apk