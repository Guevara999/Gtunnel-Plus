name: Build Gtunnel APK

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK & NDK
      uses: android-actions/setup-android@v3
      with:
        ndk: '26.3.11579264'
        build-tools: '34.0.0'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 🔍 List available assemble tasks (to see what variants exist)
    - name: List available Gradle tasks
      run: ./gradlew tasks --all | grep -i assemble

    # 🛠️ Build debug APK (no signing required)
    - name: Build Debug APK
      run: |
        ./gradlew :app:assembleDebug --stacktrace

    # 📦 Upload the debug APK as "Gtunnel"
    - name: Upload Gtunnel Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Gtunnel-Debug-APK
        path: app/build/outputs/apk/debug/*.apk