name: Build Gtunnel APK

on:
  push:
    # Trigger on pushes to these branches
    branches:
      - main
      - master
      - Dev          # <-- ADDED your current branch
      # To run on ANY branch, remove the 'branches' block entirely
  pull_request:
    branches:
      - main
      - master
      - Dev
  workflow_dispatch:   # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK & NDK
      uses: android-actions/setup-android@v3
      with:
        ndk: '28.0.13004108'          # Match your ndkVersion in build.gradle.kts
        build-tools: '34.0.0'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Optional: list available tasks (useful for debugging)
    - name: List available Gradle tasks
      run: ./gradlew tasks --all | grep -i assemble

    # Build debug APK (no signing required)
    - name: Build Debug APK
      run: |
        ./gradlew :app:assembleDebug --stacktrace

    # Upload the debug APK as "Gtunnel"
    - name: Upload Gtunnel Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Gtunnel-Debug-APK
        path: app/build/outputs/apk/debug/*.apk