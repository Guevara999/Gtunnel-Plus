name: Build Guevarah APK

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    # 2. Set up Java (Required for Android Gradle plugin)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # 3. Set up Android SDK and NDK
    - name: Set up Android SDK & NDK
      uses: android-actions/setup-android@v3
      with:
        # SagerNet requires specific build-tools and NDK versions.
        # Check your app/build.gradle for exact versions.
        # Common NDK versions: 25.1.8937393, 26.1.10909125, 26.3.11579264
        ndk: '26.3.11579264'
        build-tools: '34.0.0'
        # This action also sets ANDROID_HOME environment variable automatically.

    # 4. Set up Go (ONLY if you plan to build libbox from source).
    #    SagerNet typically uses precompiled libbox.aar from Maven.
    #    If you are NOT modifying the core, you can skip this step.
    # - name: Set up Go
    #   uses: actions/setup-go@v5
    #   with:
    #     go-version: '1.22'

    # 5. Grant execute permission to Gradle wrapper
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 6. Build the APK
    #    SagerNet has two main flavors: 'github' and 'fdroid'.
    #    'GithubRelease' uses standard signing (or auto-debug signing if no keys provided).
    - name: Build Github Release APK
      run: |
        ./gradlew :app:assembleGithubRelease --stacktrace

    # 7. Upload artifacts (APK files)
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Guevarah-apk
        path: app/build/outputs/apk/github/release/*.apk

    # (Optional) Upload mapping files for crash analytics
    - name: Upload mapping files
      uses: actions/upload-artifact@v4
      with:
        name: SagerNet-Mapping
        path: app/build/outputs/mapping/githubRelease/mapping.txt