name: Build Gtunnel APK

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout app code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK & NDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-34 build-tools;34.0.0 ndk;27.3.13750724'

    # Delete all optional source folders – this prevents 1200+ errors
    - name: Remove optional features (Xposed, Terminal, USBIP, Vendor, Tailscale, etc.)
      run: |
        rm -rf app/src/main/java/io/nekohasekai/sfa/xposed
        rm -rf app/src/main/java/io/nekohasekai/sfa/terminal
        rm -rf app/src/main/java/io/nekohasekai/sfa/usbip
        rm -rf app/src/main/java/io/nekohasekai/sfa/vendor
        rm -rf app/src/main/java/io/nekohasekai/sfa/compose/screen/tools
        rm -rf app/src/main/java/io/nekohasekai/sfa/tailscale
        rm -rf app/src/main/java/io/nekohasekai/sfa/openconnect
        rm -rf app/src/main/java/io/nekohasekai/sfa/openvpn
        rm -rf app/src/main/java/io/nekohasekai/sfa/networkquality
        rm -rf app/src/main/java/io/nekohasekai/sfa/stun
        rm -f  app/src/main/java/io/nekohasekai/sfa/bg/RootClient.kt
        rm -f  app/src/main/java/io/nekohasekai/sfa/bg/RootServer.kt
        rm -f  app/src/main/java/io/nekohasekai/sfa/utils/HookErrorClient.kt
        rm -f  app/src/main/java/io/nekohasekai/sfa/utils/HookStatusClient.kt
        rm -f  app/src/main/java/io/nekohasekai/sfa/utils/PrivilegeSettingsClient.kt

    # Check for libbox.aar; build it if missing
    - name: Check for libbox.aar
      id: check_aar
      run: |
        if [ -f app/libs/libbox.aar ]; then
          echo "found=true" >> $GITHUB_OUTPUT
        else
          echo "found=false" >> $GITHUB_OUTPUT
        fi

    - name: Set up Go (if AAR missing)
      if: steps.check_aar.outputs.found == 'false'
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Install gomobile (if AAR missing)
      if: steps.check_aar.outputs.found == 'false'
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        gomobile init

    - name: Build libbox.aar (if missing)
      if: steps.check_aar.outputs.found == 'false'
      run: |
        git clone --depth 1 --branch v1.10.0 https://github.com/SagerNet/sing-box.git
        cd sing-box
        go mod tidy
        go get -tool golang.org/x/mobile/cmd/gobind
        gomobile bind -target=android -androidapi 21 -o libbox.aar ./experimental/libbox
        mkdir -p ../app/libs
        cp libbox.aar ../app/libs/

    - name: Verify libbox.aar
      run: ls -la app/libs/libbox.aar

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug --stacktrace

    - name: Upload Gtunnel Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Gtunnel-Debug-APK
        path: app/build/outputs/apk/debug/*.apk