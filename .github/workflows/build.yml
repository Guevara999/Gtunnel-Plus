name: Build Gtunnel APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout app code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK & NDK
      uses: android-actions/setup-android@v3
      with:
        # Use the same NDK that comes with the runner, no need to install a specific version
        ndk: '27.3.13750724'   # This is already present on the runner
        build-tools: '34.0.0'

    - name: Set up Go 1.24
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Install gomobile
      run: |
        go install golang.org/x/mobile/cmd/gomobile@latest
        gomobile init

    - name: Clone sing-box and add mobile dependency
      run: |
        git clone --depth 1 --branch v1.10.0 https://github.com/SagerNet/sing-box.git
        cd sing-box
        go get -tool golang.org/x/mobile/cmd/gobind

    - name: Build libbox.aar (with explicit API 21)
      run: |
        cd sing-box
        # Use -androidapi 21 to override the default API level (16) that causes errors
        gomobile bind -target=android -androidapi 21 -o libbox.aar ./experimental/libbox
        mkdir -p ../app/libs
        cp libbox.aar ../app/libs/

    - name: Verify libbox.aar
      run: ls -la app/libs/libbox.aar

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug --stacktrace

    - name: Upload Gtunnel Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Gtunnel-Debug-APK
        path: app/build/outputs/apk/debug/*.apk